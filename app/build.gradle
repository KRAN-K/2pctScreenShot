plugins {
    id 'com.android.application'
}

android {
    namespace 'com.twopercent.screenshot'
    compileSdk 34

    defaultConfig {
        applicationId "com.twopercent.screenshot"
        minSdk 29
        targetSdk 34
        versionCode 21
        versionName "1.1.10"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies on purpose: plain Android framework APIs only.
dependencies {
}
